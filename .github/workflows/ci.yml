name: CI

on:
  push:
    branches: [main, develop]
  # Deliberately unfiltered: a PR based on another PR's branch is still code
  # heading for main, and a base filter of [main, develop] silently skipped it.
  pull_request:

jobs:
  test:
    name: Test on Node ${{ matrix.node }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        node: [22, 24]
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      # Pin npm rather than inheriting whatever each Node bundles. Node 22
      # ships npm 10 and Node 24 ships npm 11, and the two disagree about how
      # to resolve a lockfile - which is how a desync stayed invisible while
      # half this matrix was red and the release path stayed green.
      - name: Pin npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Run linter
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run type check
        run: npm run typecheck

      - name: Verify coverage evidence helper
        run: node --test scripts/record-coverage-evidence.test.mjs

      - name: Prepare coverage evidence
        id: coverage_prepare
        env:
          COVERAGE_OS: ${{ matrix.os }}
          COVERAGE_NODE: ${{ matrix.node }}
          COVERAGE_BASE: ${{ github.event.pull_request.base.sha }}
          COVERAGE_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          COVERAGE_BEFORE: ${{ github.event.before }}
          COVERAGE_AFTER: ${{ github.event.after }}
        run: node scripts/record-coverage-evidence.mjs prepare

      - name: Run tests with coverage
        id: coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Finalize coverage evidence
        if: ${{ !cancelled() && steps.coverage_prepare.outcome == 'success' && (steps.coverage.outcome == 'success' || steps.coverage.outcome == 'failure') }}
        env:
          COVERAGE_OS: ${{ matrix.os }}
          COVERAGE_NODE: ${{ matrix.node }}
          COVERAGE_BASE: ${{ github.event.pull_request.base.sha }}
          COVERAGE_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          COVERAGE_BEFORE: ${{ github.event.before }}
          COVERAGE_AFTER: ${{ github.event.after }}
          COVERAGE_TEST_OUTCOME: ${{ steps.coverage.outcome }}
        run: node scripts/record-coverage-evidence.mjs finalize

      - name: Archive coverage evidence
        if: ${{ always() && steps.coverage_prepare.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}-node-${{ matrix.node }}-attempt-${{ github.run_attempt }}
          path: |
            coverage/coverage-final.json
            coverage/coverage-summary.json
            coverage/evidence/source-before.json
            coverage/evidence/provenance.json
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      # Pin npm rather than inheriting whatever each Node bundles. Node 22
      # ships npm 10 and Node 24 ships npm 11, and the two disagree about how
      # to resolve a lockfile - which is how a desync stayed invisible while
      # half this matrix was red and the release path stayed green.
      - name: Pin npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Check for build artifacts
        run: |
          if [ ! -d "dist" ]; then
            echo "Error: dist directory not found"
            exit 1
          fi
          echo "Build successful!"

  packaged-runtime:
    name: Installed package on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        node: [22, 24]
      fail-fast: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - name: Pin npm
        run: npm install -g npm@11
      - name: Install build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and pack runtime
        run: |
          npm run build
          mkdir -p .tmp/package-artifact
          npm pack --ignore-scripts --pack-destination .tmp/package-artifact
      - name: Install and verify outside the checkout through fixture-only MCP stdio
        run: |
          smoke_prefix="$(mktemp -d)"
          trap 'rm -rf "$smoke_prefix"' EXIT
          npm install --prefix "$smoke_prefix" --omit=dev --ignore-scripts --no-audit --no-fund "$PWD"/.tmp/package-artifact/*.tgz
          node scripts/smoke-package.mjs "$smoke_prefix/node_modules/local-skills-mcp"
